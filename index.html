<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Stuart Daniells - software engineer with 6+ years in AI and cloud data engineering, building cloud services, real-time data pipelines, and AI-enabled applications." />

  <!-- Social previews. TODO: replace the relative og:url and og:image with absolute
       production URLs (e.g. https://your-domain.com/ and https://your-domain.com/og-image.png)
       so LinkedIn and X render a full card. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Stuart Daniells" />
  <meta property="og:title" content="Stuart Daniells | Software Engineer _ AI, Cloud & Data Engineering" />
  <meta property="og:description" content="6+ years of software engineering experience, specializing in AI engineering, cloud services, and real-time data pipelines" />
  <meta property="og:url" content="/" />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:alt" content="Stuart Daniells" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Stuart Daniells | Software Engineer _ AI, Cloud & Data Engineering" />
  <meta name="twitter:description" content="6+ years of software engineering experience, specializing in AI engineering, cloud services, and real-time data pipelines" />
  <meta name="twitter:image" content="/og-image.png" />

  <link rel="manifest" href="/manifest.json" />
  <title>Stuart Daniells | Software Engineer - AI, Cloud & Data Engineering</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!--
    Netlify Forms registration form.

    Netlify only parses the static HTML of a deploy, so a form rendered by
    React (see src/Pages/Contact/CommonContact.js) is invisible to it. This
    hidden form exists purely so the "contact" form is registered at deploy
    time; nobody ever sees or posts it.

    Keep the field names below in sync with the visible React form:
    name, email, message, bot-field.
  -->
  <form
    name="contact"
    method="POST"
    data-netlify="true"
    netlify-honeypot="bot-field"
    hidden
  >
    <input name="name" />
    <input name="email" type="email" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
